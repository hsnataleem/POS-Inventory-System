# fly.toml - Fly.io configuration for POS Inventory Backend
# Generated for fly.io deployment

app = "pos-inventory-backend"   # Change this to your chosen app name
primary_region = "sin"          # Change: ams=Europe, sin=Singapore, lax=Los Angeles

[build]
  dockerfile = "Dockerfile"

[env]
  USE_SQLITE = "true"
  DB_PATH = "/data/database.sqlite"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "pos_data"
  destination = "/data"
